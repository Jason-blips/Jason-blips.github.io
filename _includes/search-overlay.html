{% comment %}
  Search overlay: data embedded in script, open by #search or click search icon.
{% endcomment %}
<div id="search-overlay" class="search-overlay" aria-hidden="true">
  <div class="search-overlay__backdrop" aria-label="Close search"></div>
  <div class="search-overlay__panel">
    <button type="button" class="search-overlay__close" aria-label="Close search">&times;</button>
    <div class="search-overlay__input-wrap">
      <label for="search-input" class="visually-hidden">Search site</label>
      <input type="search" id="search-input" class="search-overlay__input" placeholder="Search..." autocomplete="off" />
      <i class="fas fa-search search-overlay__icon"></i>
    </div>
    <div id="search-results" class="search-overlay__results"></div>
    <div id="search-no-results" class="search-overlay__no-results" hidden>No results found.</div>
  </div>
</div>

<script type="application/json" id="search-index">
[
  {% assign first = true %}
  {% for p in site.pages %}
    {% if p.title and p.url != "/search.json" %}
      {% if first %}{% assign first = false %}{% else %},{% endif %}
      {"t":{{ p.title | jsonify }},"u":{{ p.url | jsonify }},"e":{{ p.excerpt | default: "" | strip_html | truncate: 120 | jsonify }}}
    {% endif %}
  {% endfor %}
  {% for p in site.posts %}
    {% if first %}{% assign first = false %}{% else %},{% endif %}
    {"t":{{ p.title | jsonify }},"u":{{ p.url | jsonify }},"e":{{ p.excerpt | default: "" | strip_html | truncate: 120 | jsonify }}}
  {% endfor %}
]
</script>

<style>
.search-overlay {
  position: fixed;
  inset: 0;
  z-index: 9999;
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding: 1.5rem;
  background: rgba(0, 0, 0, 0.5);
  backdrop-filter: blur(4px);
  box-sizing: border-box;
}
.search-overlay.is-open {
  display: flex;
}
.search-overlay__backdrop {
  position: absolute;
  inset: 0;
  cursor: pointer;
}
.search-overlay__panel {
  position: relative;
  width: 100%;
  max-width: min(560px, calc(100vw - 3rem));
  min-width: 0;
  margin-top: 10vh;
  padding: 1.5rem;
  background: var(--global-bg-color, #fff);
  border-radius: 12px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  border: 1px solid var(--global-border-color, #e5e7eb);
  box-sizing: border-box;
}
.search-overlay__close {
  position: absolute;
  top: 1rem;
  right: 1rem;
  width: 2rem;
  height: 2rem;
  padding: 0;
  font-size: 1.5rem;
  line-height: 1;
  color: var(--global-text-color-light, #6b7280);
  background: none;
  border: none;
  cursor: pointer;
  border-radius: 4px;
}
.search-overlay__close:hover {
  color: var(--global-text-color, #111);
  background: var(--global-border-color, #e5e7eb);
}
.search-overlay__input-wrap {
  position: relative;
  margin-bottom: 1rem;
  min-width: 0;
}
.search-overlay__input {
  display: block;
  width: 100%;
  max-width: 100%;
  box-sizing: border-box;
  padding: 0.75rem 1rem 0.75rem 2.5rem;
  font-size: 1rem;
  border: 1px solid var(--global-border-color, #e5e7eb);
  border-radius: 8px;
  background: var(--global-bg-color, #fff);
  color: var(--global-text-color, #111);
}
.search-overlay__input:focus {
  outline: none;
  border-color: #61afef;
  box-shadow: 0 0 0 3px rgba(97, 175, 239, 0.2);
}
.search-overlay__icon {
  position: absolute;
  left: 1rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--global-text-color-light, #9ca3af);
  pointer-events: none;
}
.search-overlay__results {
  max-height: 60vh;
  overflow-y: auto;
}
.search-overlay__results a {
  display: block;
  padding: 0.6rem 0;
  border-bottom: 1px solid var(--global-border-color, #e5e7eb);
  color: var(--global-text-color, #111);
  text-decoration: none;
  transition: background 0.15s ease;
}
.search-overlay__results a:hover {
  background: var(--global-border-color, #f3f4f6);
}
.search-overlay__results .search-result__title {
  font-weight: 600;
  margin-bottom: 0.2rem;
}
.search-overlay__results .search-result__excerpt {
  font-size: 0.875rem;
  color: var(--global-text-color-light, #6b7280);
}
.search-overlay__no-results {
  padding: 1rem 0;
  color: var(--global-text-color-light, #6b7280);
}
.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0,0,0,0);
  border: 0;
}
</style>

<script>
(function() {
  var overlay = document.getElementById('search-overlay');
  var input = document.getElementById('search-input');
  var resultsEl = document.getElementById('search-results');
  var noResultsEl = document.getElementById('search-no-results');
  var toggleLinks = document.querySelectorAll('a[href="#search"]');

  function getIndex() {
    var el = document.getElementById('search-index');
    if (!el || !el.textContent) return [];
    try {
      return JSON.parse(el.textContent);
    } catch (e) {
      return [];
    }
  }

  function openSearch() {
    overlay.classList.add('is-open');
    overlay.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    input.value = '';
    input.focus();
    resultsEl.innerHTML = '';
    noResultsEl.hidden = true;
    if (location.hash !== '#search') location.hash = 'search';
  }

  function closeSearch() {
    overlay.classList.remove('is-open');
    overlay.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    if (location.hash === '#search') history.replaceState(null, '', location.pathname + location.search);
  }

  function renderResults(items) {
    resultsEl.innerHTML = '';
    noResultsEl.hidden = true;
    if (items.length === 0) {
      noResultsEl.hidden = false;
      return;
    }
    items.forEach(function(item) {
      var a = document.createElement('a');
      a.href = item.u;
      a.addEventListener('click', function() { closeSearch(); });
      a.innerHTML = '<span class="search-result__title">' + escapeHtml(item.t) + '</span>' +
        (item.e ? '<span class="search-result__excerpt">' + escapeHtml(item.e) + '</span>' : '');
      resultsEl.appendChild(a);
    });
  }

  function escapeHtml(s) {
    if (!s) return '';
    var div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  function runSearch(q) {
    q = (q || '').trim().toLowerCase();
    var index = getIndex();
    if (!q) {
      renderResults(index.slice(0, 8));
      return;
    }
    var words = q.split(/\s+/).filter(Boolean);
    var matched = index.filter(function(item) {
      var t = (item.t || '').toLowerCase();
      var e = (item.e || '').toLowerCase();
      return words.every(function(w) {
        return t.indexOf(w) >= 0 || e.indexOf(w) >= 0;
      });
    });
    renderResults(matched.slice(0, 12));
  }

  toggleLinks.forEach(function(link) {
    link.addEventListener('click', function(e) {
      e.preventDefault();
      openSearch();
    });
  });

  overlay.querySelector('.search-overlay__backdrop').addEventListener('click', closeSearch);
  overlay.querySelector('.search-overlay__close').addEventListener('click', closeSearch);

  input.addEventListener('input', function() {
    runSearch(input.value);
  });
  input.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeSearch();
  });

  window.addEventListener('hashchange', function() {
    if (location.hash === '#search') openSearch();
    else closeSearch();
  });
  if (location.hash === '#search') openSearch();

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && overlay.classList.contains('is-open')) closeSearch();
  });

  runSearch('');
})();
</script>
